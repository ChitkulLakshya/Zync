# =============================================================================
# GitHub Actions — Release — ZYNC Web Application
# =============================================================================
#
# Creates a release when a version tag is pushed. Zync ships as a web app;
# the release artifact is the built Vite bundle.
#
# Usage: git tag v1.0.0 && git push origin v1.0.0
#
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release Web Bundle
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite frontend
        run: npm run build

      - name: Package web app bundle
        run: zip -r dist.zip dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
