# =============================================================================
# GitHub Actions — Release — ZYNC Desktop Application
# =============================================================================
#
# This workflow creates a new release when a version tag is pushed.
# It builds the Electron app for all platforms and uploads the
# installers as release assets.
#
# Usage: git tag v1.0.0 && git push origin v1.0.0
#
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Vite frontend
        run: npm run build

      - name: Package web app bundle
        run: zip -r dist.zip dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
