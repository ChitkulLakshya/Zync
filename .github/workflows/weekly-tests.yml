name: Weekly Test Execution

on:
  schedule:
    # Runs at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-tests-and-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          npm run postinstall
          
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        
      - name: Start Vite Development Server
        run: npm run dev:frontend &
        
      - name: Wait for Vite server to boot
        run: sleep 10
        
      - name: Execute Tests and Send Report
        env:
          # Inject SMTP secrets to allow the script to actually send the email
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: node scripts/run-and-report-tests.cjs
