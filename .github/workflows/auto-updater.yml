name: Auto-Update Dependencies

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Update npm packages
        run: npm update

      - name: Commit and Push Changes
        run: |
          git config user.name "ZYNC Team"
          git config user.email "consolemaster.app@gmail.com"
          
          # Check if package-lock.json was modified
          if git diff --name-only | grep -q "package-lock.json"; then
            echo "Updates found in package-lock.json. Committing..."
            git add package-lock.json
            git commit -m "build: auto-update npm dependencies"
            git push origin main
          else
            echo "No updates required. Exiting cleanly."
            exit 0
          fi
